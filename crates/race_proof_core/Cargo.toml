[package]
name = "race_proof_core"
version = "0.2.0"
edition = "2021"

[lib]
name = "race_proof_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
